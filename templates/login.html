{% extends 'base_sem_menu.html' %}

{% block title %}Login - Fiel Torcedor{% endblock %}

{% block content %}
<div class="card shadow-sm p-4 text-center" style="width: 360px; background-color: #ffffff;">
    <div class="mb-3">
        <h2 class="fw-bold m-0" style="color: #2c3e50;">Corinthians</h2>
        <small class="text-muted d-block" style="font-size: 0.75rem;">Fiel Torcedor</small>
    </div>
    
    <h4 class="mb-4 fw-normal">Login</h4>

    <form action="{{ url_for('index') }}" method="GET">
        <div class="text-start mb-3">
            <label class="form-label small mb-1">E-mail:</label>
            <input type="email" class="form-control form-control-sm" placeholder="Digite seu e-mail" required>
        </div>
        <div class="text-start mb-3">
            <label class="form-label small mb-1">Password:</label>
            <input type="password" class="form-control form-control-sm" placeholder="Digite sua senha" required>
        </div>

        <button type="submit" class="btn btn-danger w-100 mb-2" style="background-color: #d9304f;">Entrar</button>
        <a href="#" class="d-block small text-decoration-none mb-3" style="color: #0d6efd;">Recuperar Senha</a>
        <a href="{{ url_for('cadastrar_usuario') }}" class="btn btn-primary w-100 fw-bold">CADASTRAR</a>
    </form>
</div>
{% endblock %}
