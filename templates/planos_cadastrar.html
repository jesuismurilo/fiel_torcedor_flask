{% extends 'base.html' %}

{% block title %}Cadastrar Plano Sócio Torcedor{% endblock %}

{% block content %}
<div class="card p-4 shadow-sm border-0">
    <h3 class="mb-4 fw-bold">Cadastro de Plano Sócio Torcedor</h3>

    <form action="{{ url_for('cadastrar_plano') }}" method="POST">
        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label small fw-semibold">Nome do Plano:</label>
                <input type="text" name="nome" class="form-control form-control-sm" placeholder="Ex: Minha Vida" required>
            </div>
            <div class="col-md-6">
                <label class="form-label small fw-semibold">Valor Mensal:</label>
                <input type="text" name="valor" class="form-control form-control-sm" placeholder="Ex: R$ 24,50/mês" required>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-md-6">
                <label class="form-label small fw-semibold">Setor Preferencial:</label>
                <input type="text" name="setor" class="form-control form-control-sm" placeholder="Ex: Norte / Sul">
            </div>
            <div class="col-md-6">
                <label class="form-label small fw-semibold">Desconto Ingresso:</label>
                <input type="text" name="desconto" class="form-control form-control-sm" placeholder="Ex: 50%">
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-center">
            <a href="{{ url_for('listar_planos') }}" class="text-decoration-none">Voltar</a>
            <button type="reset" class="btn btn-secondary btn-sm px-4">Limpar</button>
            <button type="submit" class="btn btn-success btn-sm px-4">Salvar</button>
        </div>
    </form>
</div>
{% endblock %}
