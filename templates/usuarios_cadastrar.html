{% extends 'base.html' %}
{% block title %}Cadastro de Usuários{% endblock %}

{% block content %}
<div class="card p-4 shadow-sm border-0">
    <h3 class="mb-4 fw-bold">Cadastro de Usuários</h3>

    <form action="{{ url_for('cadastrar_usuario') }}" method="POST">
        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label small fw-semibold">Nome:</label>
                <input type="text" name="nome" class="form-control form-control-sm" required>
            </div>
            <div class="col-md-6">
                <label class="form-label small fw-semibold">Email:</label>
                <input type="email" name="email" class="form-control form-control-sm" required>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-3">
                <label class="form-label small fw-semibold">Celular:</label>
                <input type="text" name="celular" class="form-control form-control-sm">
            </div>
            <div class="col-md-3">
                <label class="form-label small fw-semibold">Data de Nascimento:</label>
                <input type="date" name="data_nascimento" class="form-control form-control-sm">
            </div>
            <div class="col-md-3">
                <label class="form-label small fw-semibold">CPF:</label>
                <input type="text" name="cpf" class="form-control form-control-sm">
            </div>
            <div class="col-md-3">
                <label class="form-label small fw-semibold text-danger">Nível de Acesso:</label>
                <select name="nivel" class="form-select form-select-sm" required>
                    <option value="">-- ESCOLHA --</option>
                    <option value="Usuário">Usuário</option>
                    <option value="Administrador">Administrador</option>
                </select>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-3">
                <label class="form-label small fw-semibold">CEP:</label>
                <input type="text" name="cep" class="form-control form-control-sm">
            </div>
            <div class="col-md-6">
                <label class="form-label small fw-semibold">Endereço:</label>
                <input type="text" name="endereco" class="form-control form-control-sm">
            </div>
            <div class="col-md-3">
                <label class="form-label small fw-semibold">Número:</label>
                <input type="text" name="numero" class="form-control form-control-sm">
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-md-5">
                <label class="form-label small fw-semibold">Complemento:</label>
                <input type="text" name="complemento" class="form-control form-control-sm">
            </div>
            <div class="col-md-4">
                <label class="form-label small fw-semibold">Cidade:</label>
                <input type="text" name="cidade" class="form-control form-control-sm">
            </div>
            <div class="col-md-3">
                <label class="form-label small fw-semibold">Estado:</label>
                <select name="estado" class="form-select form-select-sm">
                    <option value="">-- ESCOLHA --</option>
                    <option value="SP">São Paulo</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="MG">Minas Gerais</option>
                </select>
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-center">
            <a href="{{ url_for('listar_usuarios') }}" class="text-decoration-none">Voltar</a>
            <button type="reset" class="btn btn-secondary btn-sm px-4">Limpar</button>
            <button type="submit" class="btn btn-success btn-sm px-4">Salvar</button>
        </div>
    </form>
</div>
{% endblock %}
