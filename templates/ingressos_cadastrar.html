{% extends 'base.html' %}

{% block title %}Cadastrar Partida / Ingresso{% endblock %}

{% block content %}
<div class="card p-4 shadow-sm border-0">
    <h3 class="mb-4 fw-bold">Cadastro de Partida / Ingresso</h3>

    <form action="{{ url_for('cadastrar_ingresso') }}" method="POST">
        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label small fw-semibold">Partida / Confronto:</label>
                <input type="text" name="partida" class="form-control form-control-sm" placeholder="Ex: Corinthians x Palmeiras" required>
            </div>
            <div class="col-md-6">
                <label class="form-label small fw-semibold">Data do Jogo:</label>
                <input type="date" name="data" class="form-control form-control-sm" required>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-md-6">
                <label class="form-label small fw-semibold">Estádio:</label>
                <input type="text" name="estadio" class="form-control form-control-sm" value="Neo Química Arena">
            </div>
            <div class="col-md-6">
                <label class="form-label small fw-semibold">Preço Base:</label>
                <input type="text" name="preco_base" class="form-control form-control-sm" placeholder="Ex: R$ 80,00">
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-center">
            <a href="{{ url_for('listar_ingressos') }}" class="text-decoration-none">Voltar</a>
            <button type="reset" class="btn btn-secondary btn-sm px-4">Limpar</button>
            <button type="submit" class="btn btn-success btn-sm px-4">Salvar</button>
        </div>
    </form>
</div>
{% endblock %}
